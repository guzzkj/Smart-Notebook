<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4f62cf",
              "background-light": "#f6f6f8",
              "background-dark": "#13151f",
              "slate-blue": "#5C6BC0",
            },
            fontFamily: {
              "display": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<title>Smart Notebook Splash Screen</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display dark">
<!-- Splash Screen Container -->
<div class="relative flex h-screen w-full flex-col items-center justify-center bg-slate-blue overflow-hidden">
<!-- Main Logo and Branding Area -->
<div class="flex flex-col items-center justify-center gap-6">
<!-- Stylized Notebook/Pen Logo Container -->
<div class="size-16 bg-primary flex items-center justify-center text-white shadow-lg rounded-xl"><span class="material-symbols-outlined text-white text-4xl" style="">auto_stories</span></div>
<!-- Text Content -->
<div class="flex flex-col items-center gap-2">
<h1 class="text-white text-3xl tracking-tight font-extrabold" style="">Smart Notebook</h1>
<p class="text-white/80 mt-2 text-base" style="">Seu Caderno Inteligente</p>
</div>
</div>
<!-- Progress Indicator (Material Design 3 style) -->
<div class="absolute bottom-24 w-full max-w-[240px] px-4">
<div class="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
<div class="bg-white h-full w-1/3 rounded-full"></div>
</div>
</div>
<!-- Footer Branding -->
<div class="absolute bottom-10 flex flex-col items-center gap-1">
<span class="text-white/60 text-xs font-medium" style="">VERSION 2.0</span>
</div>
<!-- Background Decorative Elements (Subtle Gradients) -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-white/5 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-black/10 rounded-full blur-3xl"></div>
</div>
<!-- Hidden image for requirements compliance -->
<div class="hidden">
<img alt="background" data-alt="Minimalist geometric patterns for app splash background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBU0IKaN_wbPBs9kIHrGoSlcczrHzyVVadADaYo44IvebTi3L6DET7KHOYjohkAYD24l0sbkSUEifsu-vpbgbxeRcOgulmHHWjuaOeAhDQuza9-c0BwJcVFa3zIlvA0ixZlo7M-V55i1MXd8UwaEzkLZuJXiVd219rZCF0iXASEWo4EXPwuOgVFwxYriZQazJVK718Z_1--p4J_1DEPvBduYbUuMOrn0MR7-KXR71ucogYdEZaJrdZDN-usHQ_V6C3QxNBMnbV547gl" class="" style="">
</div>
</body></html>
