<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recuperar Senha - Smart Notebook</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: "#5C6BC0",
                            hover: "#4A59A8"
                        }
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem", // 12dp
                        "2xl": "1rem",   // 16dp
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-body antialiased text-slate-900 dark:text-slate-50 flex flex-col items-center justify-center p-6">
<main class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 p-8 md:p-10">
<!-- Branded Logo -->
<div class="mb-8 flex justify-center">
<div class="w-20 h-20 bg-indigo-50 dark:bg-indigo-900/30 rounded-2xl flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-indigo-600 dark:text-indigo-400 text-4xl" data-icon="lock_reset">lock_reset</span>
</div>
</div>
<!-- Heading & Instructions -->
<div class="text-center mb-8">
<h1 class="text-2xl font-bold tracking-tight mb-3 text-slate-900 dark:text-white">Esqueceu sua senha?</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
                Insira seu e-mail cadastrado para receber um código de recuperação.
            </p>
</div>
<!-- Form Section -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1" for="email">
                    E-mail acadêmico
                </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-xl" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200" id="email" name="email" placeholder="seu.nome@universidade.edu" type="email"/>
</div>
</div>
<!-- Safety Note -->
<div class="flex items-start gap-3 p-4 bg-indigo-50/50 dark:bg-indigo-900/10 rounded-xl border border-indigo-100/50 dark:border-indigo-800/30">
<span class="material-symbols-outlined text-indigo-600 dark:text-indigo-400 text-lg mt-0.5" data-icon="info">info</span>
<p class="text-xs text-indigo-800 dark:text-indigo-300 leading-normal">
                    Certifique-se de usar o e-mail institucional vinculado à sua conta do Smart Notebook para garantir a segurança dos seus dados.
                </p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary-hover text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-500/20 active:scale-[0.98] mt-2">
                Enviar Código
            </button>
</form>
<!-- Footer Actions -->
<div class="mt-8 space-y-4 text-center">
<button class="text-sm font-medium text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors flex items-center justify-center gap-2 mx-auto">
<span class="material-symbols-outlined text-lg" data-icon="arrow_back">arrow_back</span>
                Voltar para o Login
            </button>
<div class="pt-2">
<button class="text-xs font-semibold text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 underline underline-offset-4 decoration-slate-200 dark:decoration-slate-800">
                    Ainda precisa de ajuda? Contate o suporte
                </button>
</div>
</div>
</main>
<!-- Decorative background elements (Minimalist) -->
<div class="fixed top-0 right-0 -z-10 opacity-20 pointer-events-none">
<div class="w-[500px] h-[500px] bg-gradient-to-br from-indigo-200 to-transparent rounded-full blur-[120px] transform translate-x-1/3 -translate-y-1/3"></div>
</div>
<div class="fixed bottom-0 left-0 -z-10 opacity-20 pointer-events-none">
<div class="w-[400px] h-[400px] bg-gradient-to-tr from-slate-200 to-transparent rounded-full blur-[100px] transform -translate-x-1/3 translate-y-1/3"></div>
</div>
</body></html>
