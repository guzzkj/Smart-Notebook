<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Notebook - Calendar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4f62cf",
                        "background-light": "#f6f6f8",
                        "background-dark": "#13151f",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-nav .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
<div class="flex items-center justify-between px-4 h-16 max-w-md mx-auto w-full">
<button class="p-2 hover:bg-primary/10 rounded-full transition-colors" style="">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300" style="">menu</span>
</button>
<h1 class="text-lg font-bold tracking-tight" style="">Smart Notebook</h1>
<button class="p-2 hover:bg-primary/10 rounded-full transition-colors text-primary" style="">
<span class="material-symbols-outlined" style="">calendar_add_on</span>
</button>
</div>
</header>
<main class="flex-1 max-w-md mx-auto w-full pb-24">
<!-- Calendar Grid Container -->
<section class="p-4 bg-white dark:bg-slate-900/50 m-4 rounded-xl shadow-sm border border-primary/5">
<div class="flex items-center justify-between mb-4">
<button class="p-2 hover:bg-primary/10 rounded-full transition-colors" style="">
<span class="material-symbols-outlined" style="">chevron_left</span>
</button>
<h2 class="text-base font-semibold" style="">Outubro 2023</h2>
<button class="p-2 hover:bg-primary/10 rounded-full transition-colors" style="">
<span class="material-symbols-outlined" style="">chevron_right</span>
</button>
</div>
<!-- Days of Week -->
<div class="grid grid-cols-7 mb-2"><div class="text-center text-xs font-bold text-slate-400 py-2">D</div><div class="text-center text-xs font-bold text-slate-400 py-2">S</div><div class="text-center text-xs font-bold text-slate-400 py-2">T</div><div class="text-center text-xs font-bold text-slate-400 py-2">Q</div><div class="text-center text-xs font-bold text-slate-400 py-2">Q</div><div class="text-center text-xs font-bold text-slate-400 py-2">S</div><div class="text-center text-xs font-bold text-slate-400 py-2">S</div></div>
<!-- Calendar Days -->
<div class="grid grid-cols-7 gap-1"><!-- Empty spaces for start of month -->
<div class="aspect-square"></div>
<div class="aspect-square"></div>
<div class="aspect-square"></div>
<!-- Day 1 (Sun) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">1</span></button>
<!-- Day 2 (Mon) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">2</span><div class="flex gap-0.5 absolute bottom-1"><div class="w-1 h-1 rounded-full bg-teal-500"></div></div></button>
<!-- Day 3 (Tue) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">3</span></button>
<!-- Day 4 (Wed) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">4</span></button>
<!-- Day 5 (Thu) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">5</span><div class="flex gap-0.5 absolute bottom-1"><div class="w-1 h-1 rounded-full bg-red-400"></div></div></button>
<!-- Day 6 (Fri) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">6</span></button>
<!-- Day 7 (Sat) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">7</span></button>
<!-- Row 2 -->
<!-- Day 8 (Sun) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">8</span></button>
<!-- Day 9 (Mon) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">9</span></button>
<!-- Day 10 (Tue) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">10</span><div class="flex gap-0.5 absolute bottom-1"><div class="w-1 h-1 rounded-full bg-teal-500"></div></div></button>
<!-- Day 11 (Wed) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">11</span></button>
<!-- Day 12 (Thu) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">12</span></button>
<!-- Day 13 (Fri) -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">13</span></button>
<!-- Day 14 (Sat) - No highlight/dots as per request for weekends -->
<button class="aspect-square flex flex-col items-center justify-center rounded-lg hover:bg-primary/10 transition-colors relative"><span class="text-sm">14</span></button>
<!-- Row 3+ -->
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">15</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">16</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">17</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">18</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">19</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">20</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">21</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">22</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">23</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">24</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">25</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">26</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">27</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">28</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">29</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">30</span></button>
<button class="aspect-square flex items-center justify-center rounded-lg hover:bg-primary/10"><span class="text-sm">31</span></button></div>
</section>
<!-- Legend -->
<div class="flex items-center justify-center gap-6 px-4 py-2 opacity-70">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-red-500"></div>
<span class="text-xs font-medium" style="">Avaliação</span>
</div>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-teal-500"></div>
<span class="text-xs font-medium" style="">Atividades</span>
</div>
</div>
<!-- Activities List -->
<section class="mt-4 px-4">
<h3 class="text-lg font-bold mb-4 flex items-center gap-2" style="">Activities <span class="text-slate-400 font-normal text-sm">• Out 14</span></h3>
<div class="space-y-3">
<!-- Activity Item 1 -->
<div class="flex items-center gap-4 bg-white dark:bg-slate-900/50 p-4 rounded-xl border border-primary/5 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-red-100 dark:bg-red-900/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-red-600 dark:text-red-400" style="">quiz</span>
</div>
<div class="flex-1">
<p class="font-semibold text-sm" style="">Prova Web Services</p>
<p class="text-xs text-slate-500" style="">Avaliação • Web Services</p>
</div>
<div class="text-sm font-medium text-slate-400 shrink-0" style="">14:00</div>
</div>
<!-- Activity Item 2 -->
<div class="flex items-center gap-4 bg-white dark:bg-slate-900/50 p-4 rounded-xl border border-primary/5 shadow-sm">
<div class="w-12 h-12 rounded-lg bg-teal-100 dark:bg-teal-900/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-teal-600 dark:text-teal-400" style="">assignment_turned_in</span>
</div>
<div class="flex-1">
<p class="font-semibold text-sm" style="">Projeto Frontend UI</p>
<p class="text-xs text-slate-500" style="">Atividade • Virtual Platform</p>
</div>
<div class="text-sm font-medium text-slate-400 shrink-0" style="">23:59</div>
</div>
<!-- Activity Item 3 -->
</div>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 px-2 py-3 z-20">
<div class="max-w-md mx-auto flex justify-around items-center">
<a class="flex flex-col items-center gap-1 group" href="#" style="">
<div class="px-5 py-1 rounded-full text-slate-500 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined" style="">home</span>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400" style="">Home</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#" style="">
<div class="px-5 py-1 rounded-full bg-primary/20 text-primary group-hover:bg-primary/30 transition-colors">
<span class="material-symbols-outlined material-symbols-fill" style="">calendar_today</span>
</div>
<span class="text-xs font-bold text-slate-900 dark:text-slate-100" style="">Calendário</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#" style="">
<div class="px-5 py-1 rounded-full text-slate-500 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined" style="">menu</span>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400" style="">Menu</span>
</a>
</div>
</nav>
</body></html>
