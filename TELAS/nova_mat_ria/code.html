<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4f62cf",
                        "background-light": "#f6f6f8",
                        "background-dark": "#13151f",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>SmartCaderno - Nova Matéria</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center p-4 max-w-2xl mx-auto w-full">
<button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors text-slate-700 dark:text-slate-300" style="">
<span class="material-symbols-outlined block" style="">arrow_back</span>
</button>
<h1 class="ml-4 text-xl font-bold tracking-tight" style="">Nova Matéria</h1>
</div>
</header>
<main class="flex-1 w-full max-w-2xl mx-auto p-4 md:p-6 space-y-8">
<section class="space-y-6">
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" for="subject-name" style="">
                    Nome da Matéria <span class="text-red-500" style="">*</span>
</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none shadow-sm" id="subject-name" placeholder="Ex: Cálculo I" required="" type="text">
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" for="teacher-name" style="">
                    Nome do Professor (Opcional)
                </label>
<div class="relative">
<input class="w-full h-14 px-4 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 outline-none shadow-sm" id="teacher-name" placeholder="Ex: Dr. Silva" type="text">
</div>
</div>
<div class="space-y-4">
<h3 class="text-sm font-semibold text-slate-700 dark:text-slate-300" style="">Dias de Aula</h3>
<div class="flex flex-wrap gap-2">
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-medium hover:border-primary hover:text-primary transition-all text-sm active:scale-95" style="">
                        Segunda
                    </button>
<button class="px-5 py-2 rounded-full border border-primary bg-primary/10 text-primary font-semibold transition-all text-sm active:scale-95" style="">
                        Terça
                    </button>
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-medium hover:border-primary hover:text-primary transition-all text-sm active:scale-95" style="">
                        Quarta
                    </button>
<button class="px-5 py-2 rounded-full border border-primary bg-primary/10 text-primary font-semibold transition-all text-sm active:scale-95" style="">
                        Quinta
                    </button>
<button class="px-5 py-2 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-medium hover:border-primary hover:text-primary transition-all text-sm active:scale-95" style="">
                        Sexta
                    </button>
</div>
</div>
</section>
<section class="pt-4">
<div class="p-6 bg-primary/5 rounded-xl border border-primary/10 space-y-3">
<div class="flex items-center gap-3 text-primary">
<span class="material-symbols-outlined" style="">info</span>
<p class="text-sm font-medium" style="">Dica do Smart Notebook</p>
</div>
<p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed" style="">
                    Adicionar o nome do professor ajuda a organizar suas notas e encontrar referências bibliográficas mais rápido.
                </p>
</div>
</section>
</main>
<footer class="p-4 md:p-6 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
<div class="max-w-2xl mx-auto w-full">
<button class="w-full h-14 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" style="">
<span class="" style="">Cadastrar Matéria</span>
<span class="material-symbols-outlined text-lg" style="">check_circle</span>
</button>
</div>
</footer>
</body></html>
