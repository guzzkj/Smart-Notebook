<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4f62cf",
                        "background-light": "#f6f6f8",
                        "background-dark": "#13151f",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem", // 12dp equivalent
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>SmartCaderno - Menu</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center h-16 px-4">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-semibold mr-10">Menu</h1>
</div>
</header>
<!-- Content -->
<main class="flex-1 p-4 space-y-2">
<!-- User Profile Quick View (Optional Add-on for context) -->
<div class="p-6 mb-6 bg-primary/10 dark:bg-primary/20 rounded-xl flex items-center gap-4 border border-primary/20">
<div class="size-14 rounded-full bg-primary flex items-center justify-center text-white">
<span class="material-symbols-outlined text-3xl">account_circle</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-slate-100">Usuário Smart</p>
<p class="text-sm text-slate-600 dark:text-slate-400">smartcaderno@exemplo.com</p>
</div>
</div>
<!-- Menu List -->
<div class="flex flex-col gap-1">
<a class="flex items-center gap-4 p-4 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" href="#">
<div class="flex items-center justify-center size-10 rounded-lg bg-slate-200 dark:bg-slate-800 text-primary">
<span class="material-symbols-outlined">info</span>
</div>
<span class="flex-1 font-medium">Sobre o Aplicativo</span>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</a>
<a class="flex items-center gap-4 p-4 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" href="#">
<div class="flex items-center justify-center size-10 rounded-lg bg-slate-200 dark:bg-slate-800 text-primary">
<span class="material-symbols-outlined">lightbulb</span>
</div>
<span class="flex-1 font-medium">Guia de Produtividade</span>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</a>
<a class="flex items-center gap-4 p-4 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" href="#">
<div class="flex items-center justify-center size-10 rounded-lg bg-slate-200 dark:bg-slate-800 text-primary">
<span class="material-symbols-outlined">description</span>
</div>
<span class="flex-1 font-medium">Termos de Uso</span>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</a>
<div class="h-px bg-slate-200 dark:bg-slate-800 my-2"></div>
<a class="flex items-center gap-4 p-4 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 group transition-colors" href="#">
<div class="flex items-center justify-center size-10 rounded-lg bg-slate-200 dark:bg-slate-800 text-red-500 group-hover:bg-red-100 dark:group-hover:bg-red-900/40">
<span class="material-symbols-outlined">logout</span>
</div>
<span class="flex-1 font-medium text-red-500">Sair</span>
<span class="material-symbols-outlined text-slate-400 group-hover:text-red-300">chevron_right</span>
</a>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 px-2 py-3 z-20">
<div class="max-w-md mx-auto flex justify-around items-center">
<a class="flex flex-col items-center gap-1 group" href="#">
<div class="px-5 py-1 rounded-full text-slate-500 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">home</span>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Home</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<div class="px-5 py-1 rounded-full text-slate-500 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined">calendar_today</span>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Calendário</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<div class="px-5 py-1 rounded-full bg-primary/20 text-primary group-hover:bg-primary/30 transition-colors">
<span class="material-symbols-outlined material-symbols-fill">menu</span>
</div>
<span class="text-xs font-bold text-slate-900 dark:text-slate-100">Menu</span>
</a>
</div>
</nav>
<!-- Abstract background decoration (Subtle) -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<div class="fixed bottom-0 left-0 -z-10 w-48 h-48 bg-primary/10 rounded-full blur-3xl"></div>
</body></html>
