<!DOCTYPE html>

<html class="light" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nova Anotação - Smart Notebook</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5C6BC0",
                        "background-light": "#ffffff",
                        "background-dark": "#13151f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center justify-between px-4 py-3 bg-background-light dark:bg-background-dark border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-700 dark:text-slate-300">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-xl font-semibold tracking-tight">Nova Anotação</h1>
</div>
<button class="flex items-center justify-center size-10 rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">check</span>
</button>
</header>
<!-- Content Area -->
<main class="flex-1 flex flex-col px-6 py-4 max-w-3xl mx-auto w-full">
<!-- Title Input -->
<div class="mb-6">
<input class="w-full bg-transparent border-0 border-b-2 border-slate-100 dark:border-slate-800 focus:ring-0 focus:border-primary text-2xl font-bold py-2 px-0 placeholder:text-slate-400 dark:placeholder:text-slate-600 transition-colors" placeholder="Título da Anotação" type="text"/>
</div>
<!-- Note Text Area -->
<div class="flex-1 flex flex-col">
<textarea class="w-full flex-1 bg-transparent border-0 focus:ring-0 resize-none text-lg leading-relaxed py-2 px-0 placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="Comece a escrever sua nota aqui..."></textarea>
</div>
</main>
<!-- Optional Visual Decoration (Subtle Gradient Background) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-3xl"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-3xl"></div>
</div>
<!-- Formatting Toolbar (Fixed at bottom) -->
<div class="sticky bottom-0 w-full bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 py-3">
<div class="max-w-3xl mx-auto flex items-center justify-start gap-1">
<button class="flex items-center justify-center size-11 rounded-lg hover:bg-primary/10 text-slate-700 dark:text-slate-300 hover:text-primary transition-colors" title="Negrito">
<span class="material-symbols-outlined">format_bold</span>
</button>
<button class="flex items-center justify-center size-11 rounded-lg hover:bg-primary/10 text-slate-700 dark:text-slate-300 hover:text-primary transition-colors" title="Itálico">
<span class="material-symbols-outlined">format_italic</span>
</button>
<div class="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-2"></div>
<button class="flex items-center justify-center size-11 rounded-lg hover:bg-primary/10 text-slate-700 dark:text-slate-300 hover:text-primary transition-colors" title="Lista">
<span class="material-symbols-outlined">format_list_bulleted</span>
</button>
<button class="flex items-center justify-center size-11 rounded-lg hover:bg-primary/10 text-slate-700 dark:text-slate-300 hover:text-primary transition-colors" title="Checklist">
<span class="material-symbols-outlined">checklist</span>
</button>
<div class="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-2"></div>
<button class="flex items-center justify-center size-11 rounded-lg hover:bg-primary/10 text-slate-700 dark:text-slate-300 hover:text-primary transition-colors" title="Adicionar Imagem">
<span class="material-symbols-outlined">image</span>
</button>
<div class="flex-1"></div>
<button class="flex items-center justify-center size-11 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors" title="Mais opções">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</body></html>
