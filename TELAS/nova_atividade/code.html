<!DOCTYPE html>

<html lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4f62cf",
                        "background-light": "#f6f6f8",
                        "background-dark": "#13151f",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Bar -->
<header class="flex items-center px-4 py-4 sticky top-0 bg-background-light dark:bg-background-dark z-10 border-b border-slate-200 dark:border-slate-800">
<button class="p-2 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined block text-slate-700 dark:text-slate-300">arrow_back</span>
</button>
<h1 class="text-xl font-semibold ml-4">Nova Atividade</h1>
</header>
<main class="flex-1 overflow-y-auto px-4 pb-32">
<!-- Segmented Button -->
<div class="mt-6 flex bg-slate-200 dark:bg-slate-800 p-1 rounded-xl">
<button class="flex-1 py-2 px-4 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-sm font-semibold text-primary">
                Tarefa
            </button>
<button class="flex-1 py-2 px-4 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400">
                Prova
            </button>
</div>
<!-- Form Fields -->
<div class="mt-8 space-y-6">
<!-- Title Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Título da Atividade</label>
<div class="relative">
<input class="w-full bg-transparent border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400" placeholder="Ex: Exercícios de Álgebra" type="text"/>
</div>
</div>
<!-- Subject Selection -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Matéria</label>
<div class="relative">
<select class="w-full appearance-none bg-transparent border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all pr-10">
<option disabled="" selected="" value="">Selecione a matéria</option>
<option value="math">Matemática</option>
<option value="phys">Física</option>
<option value="hist">História</option>
<option value="port">Português</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Date Picker -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Data</label>
<div class="relative">
<input class="w-full bg-transparent border border-slate-300 dark:border-slate-700 rounded-lg pl-10 pr-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="24/10/2023" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">calendar_today</span>
</div>
</div>
<!-- Time Picker -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Horário</label>
<div class="relative">
<input class="w-full bg-transparent border border-slate-300 dark:border-slate-700 rounded-lg pl-10 pr-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="14:30" type="text"/>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">schedule</span>
</div>
</div>
</div>
<!-- Additional Notes (Optional) -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-600 dark:text-slate-400 ml-1">Observações</label>
<textarea class="w-full bg-transparent border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none placeholder:text-slate-400" placeholder="Adicione detalhes extras..." rows="3"></textarea>
</div>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 right-0 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 pb-safe shadow-2xl">
<div class="p-4">
<button class="w-full bg-primary text-white font-semibold py-4 rounded-xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all">
                Salvar Atividade
            </button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="flex justify-around items-center px-4 pb-4 pt-2 border-t border-slate-100 dark:border-slate-800">
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">home</span>
<span class="text-[10px] font-medium text-slate-400 group-hover:text-primary">Início</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">calendar_month</span>
<span class="text-[10px] font-medium text-slate-400 group-hover:text-primary">Calendário</span>
</a>
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">menu</span>
<span class="text-[10px] font-medium text-slate-400 group-hover:text-primary">Menu</span>
</a>
</nav>
</div>
</body></html>
